class: GalaxyWorkflow
label: Align reads
doc: This workflow aligns sequencing reads to generate mapped reads.
inputs:
  - id: Reads
    type: data
    format:
      - fastqsanger
outputs: []
steps:
  - id: align
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/bwa/bwa/0.7.19
    tool_version: "0.7.19"
    in: []
    out: []
    tool_state:
      reference_source:
        reference_source_selector: cached
        ref_file: hg38
