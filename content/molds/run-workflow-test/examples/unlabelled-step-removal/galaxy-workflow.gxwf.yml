class: GalaxyWorkflow
label: Short Read Quality Control
doc: This workflow runs FastQC on one short-read sequencing dataset and aggregates the report with MultiQC.
inputs:
  - id: Sequencing Reads
    type: data
    format:
      - fastqsanger
outputs:
  - id: MultiQC Report
    outputSource: aggregate_reports/html_report
steps:
  - id: quality_control
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
    tool_version: "0.74+galaxy1"
    in:
      input_file: Sequencing Reads
  - id: aggregate_reports
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.24.1+galaxy0
    tool_version: "1.24.1+galaxy0"
    in:
      results_0|software_cond|output_0|input: quality_control/text_file
    state:
      results:
        - software_cond:
            software: fastqc
