entries:
  - id: nf-core-demo-genome-key-disposition
    status: open
    kind: gap
    blocking: false
    raised_by: nextflow-summary-to-galaxy-reference-data
    unmet: "A portable Galaxy disposition for the optional source `genome` iGenomes-reference name."
    missing: "The summary provides neither a closed selector enum nor getGenomeAttribute-derived asset paths or a Galaxy data-table mapping."
    resolved_by: null
    supersedes: null
    note: "Keep the portable explicit optional `fasta` input; do not introduce a dbkey or .loc table. The key remains excluded unless later evidence establishes a curated selector or concrete expansion."
  - id: nf-core-demo-fasta-consumer-attribution
    status: open
    kind: gap
    blocking: false
    raised_by: nextflow-summary-to-galaxy-reference-data
    unmet: "A confirmed Galaxy consumer and data-flow edge for optional reference `fasta`."
    missing: "reference_assets[] records `fasta` at medium confidence but its used_by list is empty; the summary warns that workflow graph extraction is intentionally partial."
    resolved_by: null
    supersedes: null
    note: "Represent it provisionally as an optional explicit fasta dataset, but do not wire or assert a rebuild behavior without downstream evidence."
  - id: nf-core-demo-fastqc-report-identifiers
    status: resolved
    kind: gap
    blocking: false
    raised_by: nextflow-summary-to-galaxy-interface
    unmet: "Deterministic Galaxy collection element identifiers for public FastQC HTML and ZIP report collections."
    missing: "FASTQC emits tuple metadata plus wildcard per-read files; the selected test shows two reports for paired samples, but the partial summary neither defines target collection identifiers nor a direct one-report-per-sample shape."
    resolved_by: nextflow-summary-to-galaxy-data-flow
    supersedes: null
    note: "Data-flow node A explicitly explodes each input row into per-read elements keyed `sample__R1` and, when present, `sample__R2`; FastQC maps over that list and both public report collections retain those identifiers. The template must implement and test collision handling and the identifier transformation."
  - id: nf-core-demo-multiqc-directory-output-representation
    status: open
    kind: gap
    blocking: false
    raised_by: nextflow-summary-to-galaxy-interface
    unmet: "A portable public Galaxy representation decision for MultiQC's emitted `data` directory and optional `plots` directory."
    missing: "MULTIQC emits path `*_data` and optional `*_plots`; the summary establishes directory-shaped contents but no Galaxy datatype or collection contract, while the primary subworkflow declares only the HTML report."
    resolved_by: null
    supersedes: null
    note: "Do not publish these directories in the v1 interface or fabricate a collection shape. Revisit when a concrete Galaxy wrapper/output contract is selected."
  - id: nf-core-demo-trimmed-reads-metadata-carry-forward
    status: open
    kind: gap
    blocking: false
    raised_by: nextflow-summary-to-galaxy-data-flow
    step: restore_trimmed_sample_sheet_metadata
    unmet: "Realize the declared `trimmed_reads` sample_sheet:paired_or_unpaired output with the original `sample` metadata and single/paired row layout."
    missing: "Galaxy mapping over a sample-sheet collection does not propagate column_definitions or row columns; the summary provides no concrete Galaxy collection-operation/rules configuration for reattaching them after SEQTK_TRIM."
    resolved_by: null
    supersedes: null
    note: "The data-flow brief requires an identifier-keyed reconstruction/carry-forward placeholder after trimming. Template and implementation work must choose and test the concrete Galaxy operation without using parallel scalar metadata inputs."
  - id: nf-core-demo-mixed-sample-sheet-read-label-idiom
    status: open
    kind: gap
    blocking: false
    raised_by: compare-against-iwc-exemplar
    step: explode_and_label_input_reads
    unmet: "A corpus-grounded Galaxy template idiom that explodes `sample_sheet:paired_or_unpaired` into a deterministic per-read list while retaining the source-row/mate map."
    missing: "The nearest domain exemplar `read-preprocessing/short-read-qc-trimming` accepts a `list:paired` directly; it has no mixed single/paired sample-sheet input, `sample` column, optional mate, or `sample__R1`/`sample__R2` expansion."
    resolved_by: null
    supersedes: null
    note: "Keep node A as an explicit, collision-checked template placeholder and test its identifiers. Do not flatten the public interface to the exemplar's `list:paired` shape."
  - id: nf-core-demo-fastqc-zip-wrapper-output
    status: open
    kind: gap
    blocking: true
    raised_by: advance-galaxy-draft-step
    step: fastqc_per_read
    unmet: "Produce the declared per-read FastQC ZIP archive collection alongside the HTML reports."
    missing: "The resolved Tool Shed FastQC wrapper `toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc` at `0.74+galaxy1` accepts the mapped FASTQ on `input_file` but exposes only `html_file` (html) and `text_file` (txt); it has no ZIP output port."
    resolved_by: null
    supersedes: null
    note: "Wrapper discovery/cache confirmation and summary were run against the shared cache. Its source-compatible FastQC 0.12.1 wrapper cannot realize the required ZIP checkpoint from this draft step. Do not bind `text_file` as a ZIP archive; repair requires a ZIP-emitting wrapper/sub-path or an explicit, audited narrowing of the public ZIP output."
