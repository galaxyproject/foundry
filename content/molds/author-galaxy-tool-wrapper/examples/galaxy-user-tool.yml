class: GalaxyUserTool
id: count_lines
version: 1.0.0
name: Count text lines
description: Count lines in a text dataset.
container: python:3.12.0
shell_command: >-
  python3 -c 'import sys; print(sum(1 for _ in open(sys.argv[1])))'
  '$(inputs.text_file.path)' > count.txt
inputs:
  - name: text_file
    type: data
    format: [txt]
    label: Text file to count
outputs:
  - name: count
    type: data
    format: txt
    from_work_dir: count.txt
    label: Number of text lines
help:
  format: markdown
  content: |
    Counts every line, including blank lines and a final line without a newline.
    Writes the count followed by a newline to a text dataset.
