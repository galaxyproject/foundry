class: GalaxyWorkflow
label: Variant Calling Tutorial
doc: Call variants for the tutorial sample against the tutorial reference.
license: MIT
release: "0.1"
inputs:
  - id: Aligned Reads
    type: data
    format:
      - bam
outputs:
  - id: Variant Calls
    outputSource: call_variants/vcf
steps:
  - id: call_variants
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/freebayes/freebayes/1.3.6+galaxy0
    in:
      alignment: Aligned Reads
    state:
      reference_source:
        reference_source_selector: history
        ref_file: /data/tutorials/mrsa/reference_GCF_000008985.1.fasta
      target_region: "NC_002951.2:100000-200000"
