# pre-commit config for foundry
#
# Install hooks:   pre-commit install
# Run on all:      pre-commit run --all-files
# Update pins:     pre-commit autoupdate
# Skip once:       SKIP=eslint git commit ...   (prefer fixing over skipping)

# Skip generated/synced sources, test fixtures, and lockfiles — not ours to
# reformat and hygiene hooks would cause noise or break vendored mirrors.
#
# The research rule covers every file in a research note's directory EXCEPT the note: those
# are its companions, and the vendored ones are byte-for-byte upstream copies that a
# whitespace fixer would silently fork from their source. This used to name `cwl-v1.2/`
# alone, which held only while the other vendored files were flat and had no directory to
# spell — `galaxy.xsd` and `*.upstream.myst` were unprotected the whole time, and went
# unnoticed only because a file nobody edits is a file no hook ever sees.
exclude: |
  (?x)^(
    packages/tests-format-schema/src/tests\.schema\.|
    content/research/[^/]+/(?!index\.md$)|
    packages/.*/test/fixtures/|
    workflow-fixtures/|
    casts/|
    site/\.astro/|
    site/dist/|
    pnpm-lock\.yaml$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: [--fix=lf]

  # Local hooks shell out to pnpm so versions track package.json, not a mirror.
  # language: system means pre-commit won't create its own env — it uses the
  # repo's already-installed pnpm/node (run `pnpm install` first).
  - repo: local
    hooks:
      # Root `tests/` is in, `scripts/` is not: `seed-mold-stubs.ts` keeps a hand-aligned
      # record table that prettier would expand to four times the lines.
      - id: prettier
        name: prettier (write)
        entry: pnpm exec prettier --write
        language: system
        files: ^(packages/.*/(src|test)|tests)/.*\.ts$
        pass_filenames: true

      - id: eslint
        name: eslint (fix)
        entry: pnpm exec eslint --fix
        language: system
        files: ^packages/.*/(src|test)/.*\.ts$
        pass_filenames: true
