name: Packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Typecheck packages
        run: npm run packages-typecheck

      - name: Build packages
        run: npm run packages-build

      - name: Check package exports and declarations
        run: npm run lint:packages

      # Runs after build because the validator imports
      # @galaxy-foundry/foundry/meta to enumerate known CLI commands; the
      # `./meta` subpath only resolves once `dist/` exists.
      - name: Validate content
        run: npm run validate

      - name: Check the kind manifest is current
        run: npm run check:kinds

      # Dashboard.md and Index.md are generated from content frontmatter, so
      # editing a note without regenerating leaves them silently wrong. Runs
      # the same target `make check` does rather than listing the checks a
      # second time. Same placement rule as validate: needs `dist/`.
      - name: Check generated content notes are current
        run: make check-generated

      - name: Typecheck root and site
        run: npm run typecheck

      - name: Run repo tests
        run: npm run test

      - name: Cache Nextflow pipeline fixtures
        id: fixture-cache
        uses: actions/cache@v4
        with:
          path: workflow-fixtures/pipelines
          key: nf-fixtures-v1-${{ hashFiles('workflow-fixtures/fixtures.yaml') }}

      - name: Materialize required Nextflow fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          # Only fetch the pipelines the integration tests actually exercise;
          # `make fixtures-nextflow` clones all 15 pinned pipelines, which is
          # wasteful on a cold CI cache. Add new names here as tests grow.
          set -euo pipefail
          for name in nf-core/demo nf-core/bacass nf-core/rnaseq; do
            workflow-fixtures/scripts/fetch.sh "$name"
          done

      - name: Test packages
        run: npm run packages-test

      - name: Smoke-test package tarballs
        run: npm run smoke:packages

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Cast drift check
        run: make check-casts

      - name: Cast bundle verification
        run: make check-verify

      - name: Build site
        run: npm run site:build

  # A PR that changes a published package without a changeset merges green and then
  # ships nothing — the release workflow sees no pending changesets and no-ops.
  # The Version Packages PR is excluded because it has consumed the changesets.
  changeset:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm changeset status --since="origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}
