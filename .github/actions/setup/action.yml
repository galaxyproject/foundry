name: Setup
description: Install pnpm, Node.js, and locked dependencies

inputs:
  node-version:
    description: Node.js version used by the job
    default: "24"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
