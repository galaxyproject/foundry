# Claude cast target.
#
# Read by the caster and by scripts/cast-skill-verify.ts. Defines the deterministic side of
# cast assembly: where each kind of reference lands and what files the generated skill must
# produce.
#
# The provenance schema version is NOT declared here. The record's shape belongs to the caster
# that writes it, so the version ships with @galaxy-foundry/cast; a target declaring its own
# could name a shape the caster does not emit.
#
# Nor is this target's own name. A target is addressed by the directory holding this file —
# `--target=claude` and the site's discovery both mean `casts/claude/` — so a `name:` here would
# be a second answer to a settled question, and one nothing would notice going wrong.

# Where this target's bundles sit under casts/claude/. `{mold}` is the bundle name.
# The `skills/` level is what makes casts/claude/ double as a Claude Code plugin root:
# .claude-plugin/plugin.json beside skills/<name>/SKILL.md. A target that declares no
# bundle_path gets one directory per bundle, named for it.
bundle_path: skills/{mold}

# What a cast of a Mold is here: the file it writes, and the word it calls itself.
#
# Both are Claude's, not casting's. `SKILL.md` is the filename this harness looks for, and
# `skill` is what it calls what it finds — the caster substitutes the noun for `Mold` through
# the cast body, so a target shipping something else says so once, here.
#
# `_provenance.json` is deliberately absent. The record is the CASTER's account of what it did,
# and everything that reads a bundle without knowing which target made it finds it by that name.
document:
  path: SKILL.md
  noun: skill

# Required runtime artifacts the generated skill must produce, checked by the deterministic
# verifier before any agentic review.
#
# Not declared, because the default is exactly these two: `document.path` and the provenance
# record. Spelling them out restated what casting always writes, and a target that merely agrees
# with the caster has only created somewhere for the two to disagree. Declare this to require
# something ELSE.

# Per-reference-kind PLACEMENT: where this target puts each kind, and under what extension.
# `dst` is computed from the source slug; the verifier enforces 1:1.
#
# Placement only. Whether a kind is castable at all, how it resolves, and what it defaults to
# are the KIND's to declare, in reference_contract.yml's `cast:` blocks — a kind with no such
# block is refused there, not here. `modes` below is a CONSTRAINT on what the kind allows:
# this target may refuse a mode the kind permits, and can never permit one the kind does not.
kinds:
  schema:
    dst_dir: references/schemas/
    dst_extension: .schema.json
    modes: [verbatim]
  research:
    dst_dir: references/notes/
    dst_extension: .md
    modes: [verbatim]
  pattern:
    dst_dir: references/patterns/
    dst_extension: .md
    modes: [verbatim]
  cli-tool:
    dst_dir: references/cli/
    dst_extension: .md
    modes: [verbatim]
  cli-command:
    dst_dir: references/cli/
    dst_extension: .json
    modes: [sidecar]
  prompt:
    dst_dir: references/prompts/
    dst_extension: .md
    modes: [verbatim]

# Generated-skill constraints checked by cast-skill-verify.ts.
#
# Which COMPANION files a cast may never carry is not listed here. Every kind declares a
# disposition per companion (packages/gxwf-foundry-note-schema/src/types/*/schema.ts) and the verifier reads
# those directly. The hand-written `forbid_packaged_files` this file used to carry named `eval.md`
# and `refinement.md` while the kinds declared six more; a target-level copy of a kind-level fact
# is only ever a chance for the two to disagree.
skill_constraints:
  frontmatter_required: [name, description]
  forbidden_runtime_paths:
    - content/molds/
    - content/research/
    - content/schemas/
