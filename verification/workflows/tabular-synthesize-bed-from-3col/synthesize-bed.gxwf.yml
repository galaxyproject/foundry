class: GalaxyWorkflow
name: "Convert one-based interval rows to strand-specific BED"
inputs:
  - id: forward_intervals
    type: data
  - id: reverse_intervals
    type: data
outputs:
  - id: forward_bed
    outputSource: make_forward_bed/outfile
  - id: reverse_bed
    outputSource: make_reverse_bed/outfile
steps:
  - id: make_forward_bed
    label: make_forward_bed
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_awk_tool/9.5+galaxy0
    tool_version: "9.5+galaxy0"
    tool_shed_repository:
      changeset_revision: 3dc70b59608c
      name: text_processing
      owner: bgruening
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: infile
        source: forward_intervals
    out:
      - id: outfile
        change_datatype: bed
    tool_state:
      code: 'BEGIN {OFS="\t"} {print $1, $2 - 1, $3, "forward", "1", "+"}'
      infile: { __class__: ConnectedValue }
      variables: []
  - id: make_reverse_bed
    label: make_reverse_bed
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_awk_tool/9.5+galaxy0
    tool_version: "9.5+galaxy0"
    tool_shed_repository:
      changeset_revision: 3dc70b59608c
      name: text_processing
      owner: bgruening
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: infile
        source: reverse_intervals
    out:
      - id: outfile
        change_datatype: bed
    tool_state:
      code: 'BEGIN {OFS="\t"} {print $1, $2 - 1, $3, "reverse", "1", "-"}'
      infile: { __class__: ConnectedValue }
      variables: []
