class: GalaxyWorkflow
name: "Regex-built mapping table relabels a sibling collection"
inputs:
  - id: reads
    type: collection
    collection_type: list
  - id: reports
    type: collection
    collection_type: list
outputs:
  - id: mapping
    outputSource: build_mapping/outfile
  - id: relabeled
    outputSource: relabel_reports/output
  - id: relabeled_first
    outputSource: first_relabeled/output
steps:
  - id: read_identifiers
    label: read_identifiers
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/collection_element_identifiers/collection_element_identifiers/0.0.3
    tool_version: 0.0.3
    tool_shed_repository:
      changeset_revision: 3e27acfa4830
      name: collection_element_identifiers
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input_collection
        source: reads
    out:
      - id: output
        change_datatype: tabular
    tool_state:
      input_collection:
        __class__: ConnectedValue
  - id: build_mapping
    label: build_mapping
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_find_and_replace/9.5+galaxy3
    tool_version: 9.5+galaxy3
    tool_shed_repository:
      changeset_revision: ab83aa685821
      name: text_processing
      owner: bgruening
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: infile
        source: read_identifiers/output
    out:
      - id: outfile
    tool_state:
      infile:
        __class__: ConnectedValue
      find_and_replace:
        - find_pattern: '^((.+)\.fastq)$'
          replace_pattern: '$1\t$2'
          is_regex: true
          global: false
          caseinsensitive: false
          wholewords: false
          skip_first_line: false
          searchwhere:
            searchwhere_select: line
  - id: relabel_reports
    label: relabel_reports
    tool_id: __RELABEL_FROM_FILE__
    in:
      - id: input
        source: reports
      - id: how|labels
        source: build_mapping/outfile
    out:
      - id: output
    tool_state:
      input:
        __class__: ConnectedValue
      how:
        how_select: tabular
        labels:
          __class__: ConnectedValue
        strict: false
  - id: first_relabeled
    label: first_relabeled
    tool_id: __EXTRACT_DATASET__
    in:
      - id: input
        source: relabel_reports/output
    out:
      - id: output
    tool_state:
      input:
        __class__: ConnectedValue
      which:
        which_dataset: by_index
        index: 0
