- doc: "Each element's own text value selects that element's Cut1 delimiter, and its own boolean sets wc_gnu include_header"
  job:
    rows:
      class: Collection
      collection_type: list
      elements:
        - identifier: a
          class: File
          path: test-data/row_a.txt
          filetype: txt
        - identifier: b
          class: File
          path: test-data/row_b.txt
          filetype: txt
    per_element_delimiter:
      class: Collection
      collection_type: list
      elements:
        - identifier: a
          class: File
          path: test-data/a_delim.txt
          filetype: txt
        - identifier: b
          class: File
          path: test-data/b_delim.txt
          filetype: txt
    per_element_header:
      class: Collection
      collection_type: list
      elements:
        - identifier: a
          class: File
          path: test-data/a_header.txt
          filetype: txt
        - identifier: b
          class: File
          path: test-data/b_header.txt
          filetype: txt
  outputs:
    cut_columns:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        a:
          asserts:
            - that: has_line
              line: "y-z"
        b:
          asserts:
            - that: has_line
              line: "z"
    line_counts:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        a:
          asserts:
            - that: has_n_lines
              n: 2
            - that: has_text
              text: "#lines"
        b:
          asserts:
            - that: has_n_lines
              n: 1
            - that: not_has_text
              text: "#lines"
