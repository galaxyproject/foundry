class: GalaxyWorkflow
name: "Group and aggregate tabular rows with Datamash"
inputs:
  - id: rows
    type: data
outputs:
  - id: grouped
    outputSource: grouped_summary/out_file
  - id: whole_file_absmax
    outputSource: whole_file_absmax/out_file
steps:
  - id: grouped_summary
    label: grouped_summary
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/datamash_ops/datamash_ops/1.9+galaxy0
    tool_version: "1.9+galaxy0"
    tool_shed_repository:
      changeset_revision: d642efa5cbd7
      name: datamash_ops
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: in_file
        source: rows
    out:
      - id: out_file
    tool_state:
      grouping: "1"
      header_in: true
      header_out: true
      need_sort: true
      ignore_case: false
      narm: false
      print_full_line: false
      in_file:
        __class__: ConnectedValue
      operations:
        - op_name: countunique
          op_column: "2"
        - op_name: min
          op_column: "2"
        - op_name: max
          op_column: "2"
        - op_name: collapse
          op_column: "3"
  - id: whole_file_absmax
    label: whole_file_absmax
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/datamash_ops/datamash_ops/1.9+galaxy0
    tool_version: "1.9+galaxy0"
    tool_shed_repository:
      changeset_revision: d642efa5cbd7
      name: datamash_ops
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: in_file
        source: rows
    out:
      - id: out_file
    tool_state:
      grouping: ""
      header_in: true
      header_out: false
      need_sort: false
      ignore_case: false
      narm: false
      print_full_line: false
      in_file:
        __class__: ConnectedValue
      operations:
        - op_name: absmax
          op_column: "2"
