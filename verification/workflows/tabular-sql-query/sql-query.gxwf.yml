class: GalaxyWorkflow
name: "SQL join and per-group percentage"
inputs:
  - id: counts
    type: data
  - id: cohorts
    type: data
outputs:
  - id: percentages
    outputSource: query/output
steps:
  - id: query
    label: query
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/query_tabular/query_tabular/3.3.2
    tool_version: 3.3.2
    tool_shed_repository:
      changeset_revision: cf4397560712
      name: query_tabular
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: tables_0|table
        source: counts
      - id: tables_1|table
        source: cohorts
    out:
      - id: output
    tool_state:
      tables:
        - table: { __class__: ConnectedValue }
          input_opts:
            linefilters:
              - filter:
                  filter_type: skip
                  skip_lines: "1"
          tbl_opts:
            table_name: counts
            column_names_from_first_line: false
            col_names: sample,amount
            load_named_columns: false
            indexes: []
        - table: { __class__: ConnectedValue }
          input_opts:
            linefilters:
              - filter:
                  filter_type: skip
                  skip_lines: "1"
          tbl_opts:
            table_name: cohorts
            column_names_from_first_line: false
            col_names: sample,cohort
            load_named_columns: false
            indexes: []
      sqlquery: |-
        SELECT counts.sample, cohorts.cohort, counts.amount,
               ROUND(100.0 * counts.amount /
                     SUM(counts.amount) OVER (PARTITION BY cohorts.cohort), 1) AS percent
        FROM counts JOIN cohorts ON counts.sample = cohorts.sample
        ORDER BY counts.sample
      query_result:
        header: "yes"
        header_prefix: ""
      workdb: workdb.sqlite
