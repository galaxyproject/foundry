class: GalaxyWorkflow
name: "Gate on non-empty result"
inputs:
  - id: results
    type: collection
    collection_type: list
  - id: table
    type: data
outputs:
  - id: has_elements
    outputSource: has_elements/boolean_param
  - id: ran_when_nonempty
    outputSource: report_identifiers/out_file1
  - id: ran_when_empty
    outputSource: note_no_elements/out_file1
  - id: collection_branch
    outputSource: collection_branch/data_param
  - id: table_has_content
    outputSource: table_has_content/output_param_boolean
  - id: table_branch
    outputSource: table_branch/data_param
steps:
  # collection shim: count element identifiers, then turn the count into a boolean
  - id: identifiers
    label: identifiers
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/collection_element_identifiers/collection_element_identifiers/0.0.3
    tool_version: 0.0.3
    tool_shed_repository:
      changeset_revision: 3e27acfa4830
      name: collection_element_identifiers
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input_collection
        source: results
    out:
      - id: output
    tool_state:
      input_collection:
        __class__: ConnectedValue
  - id: count_identifiers
    label: count_identifiers
    tool_id: wc_gnu
    tool_version: 1.0.0
    in:
      - id: input1
        source: identifiers/output
    out:
      - id: out_file1
    tool_state:
      include_header: false
      input1:
        __class__: ConnectedValue
      options:
        - lines
  - id: count_to_boolean_table
    label: count_to_boolean_table
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/column_maker/Add_a_column1/2.1
    tool_version: "2.1"
    tool_shed_repository:
      changeset_revision: aff5135563c6
      name: column_maker
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input
        source: count_identifiers/out_file1
    out:
      - id: out_file1
    tool_state:
      avoid_scientific_notation: false
      error_handling:
        auto_col_types: true
        fail_on_non_existent_columns: true
        non_computable:
          action: --fail-on-non-computable
      input:
        __class__: ConnectedValue
      ops:
        header_lines_select: "no"
        expressions:
          - cond: c1 != 0
            add_column:
              mode: R
              pos: "1"
  - id: has_elements
    label: has_elements
    tool_id: param_value_from_file
    tool_version: 0.1.0
    in:
      - id: input1
        source: count_to_boolean_table/out_file1
    out:
      - id: boolean_param
    tool_state:
      input1:
        __class__: ConnectedValue
      param_type: boolean
      remove_newlines: true
  # gated on the collection boolean, and on its negation
  - id: report_identifiers
    label: report_identifiers
    tool_id: cat1
    tool_version: 1.0.0
    in:
      - id: input1
        source: identifiers/output
      - id: when
        source: has_elements/boolean_param
    out:
      - id: out_file1
    tool_state:
      input1:
        __class__: ConnectedValue
    when: $(inputs.when)
  - id: note_no_elements
    label: note_no_elements
    tool_id: cat1
    tool_version: 1.0.0
    in:
      - id: input1
        source: count_to_boolean_table/out_file1
      - id: when
        source: has_elements/boolean_param
    out:
      - id: out_file1
    tool_state:
      input1:
        __class__: ConnectedValue
    when: $(!inputs.when)
  # fails unless exactly one of the two gated steps ran
  - id: collection_branch
    label: collection_branch
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      changeset_revision: b19e21af9c52
      name: pick_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: style_cond|type_cond|pick_from_0|value
        source: report_identifiers/out_file1
      - id: style_cond|type_cond|pick_from_1|value
        source: note_no_elements/out_file1
    out:
      - id: data_param
    tool_state:
      style_cond:
        pick_style: only
        type_cond:
          param_type: data
          pick_from:
            - value:
                __class__: ConnectedValue
            - value:
                __class__: ConnectedValue
  # text shim: read the dataset as text, map "" to false and anything else to true
  - id: table_text
    label: table_text
    tool_id: param_value_from_file
    tool_version: 0.1.0
    in:
      - id: input1
        source: table
    out:
      - id: text_param
    tool_state:
      input1:
        __class__: ConnectedValue
      param_type: text
      remove_newlines: true
  - id: table_has_content
    label: table_has_content
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/map_param_value/map_param_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      changeset_revision: 022a635f2283
      name: map_param_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input_param_type|input_param
        source: table_text/text_param
    out:
      - id: output_param_boolean
    tool_state:
      input_param_type:
        type: text
        input_param:
          __class__: ConnectedValue
        mappings:
          - from: ""
            to: "false"
      output_param_type: boolean
      unmapped:
        on_unmapped: default
        default_value: "true"
  # gated on the text boolean, and on its negation
  - id: report_table
    label: report_table
    tool_id: cat1
    tool_version: 1.0.0
    in:
      - id: input1
        source: table
      - id: when
        source: table_has_content/output_param_boolean
    out:
      - id: out_file1
    tool_state:
      input1:
        __class__: ConnectedValue
    when: $(inputs.when)
  - id: count_table_lines
    label: count_table_lines
    tool_id: wc_gnu
    tool_version: 1.0.0
    in:
      - id: input1
        source: table
      - id: when
        source: table_has_content/output_param_boolean
    out:
      - id: out_file1
    tool_state:
      include_header: false
      input1:
        __class__: ConnectedValue
      options:
        - lines
    when: $(!inputs.when)
  - id: table_branch
    label: table_branch
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      changeset_revision: b19e21af9c52
      name: pick_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: style_cond|type_cond|pick_from_0|value
        source: report_table/out_file1
      - id: style_cond|type_cond|pick_from_1|value
        source: count_table_lines/out_file1
    out:
      - id: data_param
    tool_state:
      style_cond:
        pick_style: only
        type_cond:
          param_type: data
          pick_from:
            - value:
                __class__: ConnectedValue
            - value:
                __class__: ConnectedValue
