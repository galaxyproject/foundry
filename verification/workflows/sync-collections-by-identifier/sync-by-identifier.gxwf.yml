class: GalaxyWorkflow
name: "Sync a sibling collection by element identifier"
inputs:
  - id: kept
    type: collection
    collection_type: list
  - id: sibling
    type: collection
    collection_type: list
  - id: labels
    type: data
outputs:
  - id: kept_ids
    outputSource: kept_identifiers/output
  - id: synced
    outputSource: filter_sibling/output_filtered
  - id: discarded
    outputSource: filter_sibling/output_discarded
  - id: synced_first
    outputSource: first_synced_element/output
  - id: relabeled
    outputSource: relabel_sibling/output
steps:
  - id: kept_identifiers
    label: kept_identifiers
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/collection_element_identifiers/collection_element_identifiers/0.0.3
    tool_version: 0.0.3
    tool_shed_repository:
      changeset_revision: 3e27acfa4830
      name: collection_element_identifiers
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input_collection
        source: kept
    out:
      - id: output
    tool_state:
      input_collection:
        __class__: ConnectedValue
  - id: filter_sibling
    label: filter_sibling
    tool_id: __FILTER_FROM_FILE__
    in:
      - id: input
        source: sibling
      - id: how|filter_source
        source: kept_identifiers/output
    out:
      - id: output_filtered
      - id: output_discarded
    tool_state:
      input:
        __class__: ConnectedValue
      how:
        how_filter: remove_if_absent
        filter_source:
          __class__: ConnectedValue
  - id: first_synced_element
    label: first_synced_element
    tool_id: __EXTRACT_DATASET__
    in:
      - id: input
        source: filter_sibling/output_filtered
    out:
      - id: output
    tool_state:
      input:
        __class__: ConnectedValue
      which:
        which_dataset: by_index
        index: 0
  - id: relabel_sibling
    label: relabel_sibling
    tool_id: __RELABEL_FROM_FILE__
    in:
      - id: input
        source: sibling
      - id: how|labels
        source: labels
    out:
      - id: output
    tool_state:
      input:
        __class__: ConnectedValue
      how:
        how_select: txt
        labels:
          __class__: ConnectedValue
        strict: false
