class: GalaxyWorkflow
name: "Harmonize a sibling collection by sortlist from identifiers"
inputs:
  - id: reference
    type: collection
    collection_type: list
  - id: sibling
    type: collection
    collection_type: list
outputs:
  - id: order_file
    outputSource: reference_identifiers/output
  - id: harmonized
    outputSource: sorted_sibling/output
  - id: harmonized_first
    outputSource: first_element/output
  - id: harmonized_last
    outputSource: last_element/output
steps:
  - id: reference_identifiers
    label: reference_identifiers
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/collection_element_identifiers/collection_element_identifiers/0.0.3
    tool_version: 0.0.3
    tool_shed_repository:
      changeset_revision: 3e27acfa4830
      name: collection_element_identifiers
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input_collection
        source: reference
    out:
      - id: output
    tool_state:
      input_collection:
        __class__: ConnectedValue
  - id: sorted_sibling
    label: sorted_sibling
    tool_id: __SORTLIST__
    in:
      - id: input
        source: sibling
      - id: sort_type|sort_file
        source: reference_identifiers/output
    out:
      - id: output
    tool_state:
      input:
        __class__: ConnectedValue
      sort_type:
        sort_type: file
        sort_file:
          __class__: ConnectedValue
  - id: first_element
    label: first_element
    tool_id: __EXTRACT_DATASET__
    in:
      - id: input
        source: sorted_sibling/output
    out:
      - id: output
    tool_state:
      input:
        __class__: ConnectedValue
      which:
        which_dataset: by_index
        index: 0
  - id: last_element
    label: last_element
    tool_id: __EXTRACT_DATASET__
    in:
      - id: input
        source: sorted_sibling/output
    out:
      - id: output
    tool_state:
      input:
        __class__: ConnectedValue
      which:
        which_dataset: by_index
        index: 2
