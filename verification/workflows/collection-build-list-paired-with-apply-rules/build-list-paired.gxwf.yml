class: GalaxyWorkflow
name: "Build list:paired from read-direction identifiers with Apply Rules"
inputs:
  - id: reads
    type: collection
    collection_type: list
outputs:
  - id: pairs
    outputSource: pair_by_identifier/output
steps:
  # column 0 is the identifier, the regex appends sample (1) and R1/R2 (2)
  - id: pair_by_identifier
    label: pair_by_identifier
    tool_id: __APPLY_RULES__
    in:
      - id: input
        source: reads
    out:
      - id: output
    tool_state:
      input:
        __class__: ConnectedValue
      rules:
        rules:
          - type: add_column_metadata
            value: identifier0
          - type: add_column_regex
            target_column: 0
            expression: '^(.+)_(R[12])$'
            group_count: 2
        mapping:
          - type: list_identifiers
            columns: [1]
          - type: paired_identifier
            columns: [2]
