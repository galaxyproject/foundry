- doc: "Left arms gated on: each merge keeps the live arm, and a direct merge carries the skipped arm's nulls"
  job: &job
    samples:
      class: Collection
      collection_type: list
      elements:
        - identifier: s1
          class: File
          path: test-data/mapped-s1.txt
          filetype: txt
        - identifier: s2
          class: File
          path: test-data/mapped-s2.txt
          filetype: txt
    left_samples:
      class: Collection
      collection_type: list
      elements:
        - identifier: a1
          class: File
          path: test-data/mapped-a1.txt
          filetype: txt
        - identifier: a2
          class: File
          path: test-data/mapped-a2.txt
          filetype: txt
    right_samples:
      class: Collection
      collection_type: list
      elements:
        - identifier: b1
          class: File
          path: test-data/mapped-b1.txt
          filetype: txt
        - identifier: b2
          class: File
          path: test-data/mapped-b2.txt
          filetype: txt
        - identifier: b3
          class: File
          path: test-data/mapped-b3.txt
          filetype: txt
    left_marker:
      class: File
      path: test-data/left-marker.txt
      filetype: txt
    right_marker:
      class: File
      path: test-data/right-marker.txt
      filetype: txt
    use_left: true
    use_right: false
  outputs:
    same_arms_tool_shed_pick_value:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        s1:
          asserts:
            - that: has_text
              text: sample-one
            - that: has_text
              text: left-arm
        s2:
          asserts:
            - that: has_text
              text: sample-two
            - that: has_text
              text: left-arm
    same_arms_builtin_pick_value:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        s1:
          asserts:
            - that: has_text
              text: sample-one
            - that: has_text
              text: left-arm
        s2:
          asserts:
            - that: has_text
              text: sample-two
            - that: has_text
              text: left-arm
    different_arms_filter_then_merge:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        a1:
          asserts:
            has_text:
              text: left-one
        a2:
          asserts:
            has_text:
              text: left-two
    same_arms_direct_merge:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        s1:
          asserts:
            - that: has_text
              text: sample-one
            - that: has_text
              text: left-arm
        s2:
          asserts:
            - that: has_text
              text: sample-two
            - that: has_text
              text: left-arm
    same_arms_direct_merge_live_plus_right_samples:
      class: Collection
      collection_type: list
      element_count: 5
      element_tests:
        s1:
          asserts:
            - that: has_text
              text: sample-one
            - that: has_text
              text: left-arm
        b1:
          asserts:
            has_text:
              text: right-one
    different_arms_direct_merge:
      class: Collection
      collection_type: list
      element_count: 5
      element_tests:
        a1:
          asserts:
            has_text:
              text: left-one
        a2:
          asserts:
            has_text:
              text: left-two
    different_arms_direct_merge_live:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        a1:
          asserts:
            has_text:
              text: left-one
        a2:
          asserts:
            has_text:
              text: left-two

- doc: "Right arms gated on: pick_value keeps the live arm, while a direct merge of same-collection arms keeps only the skipped first arm's null elements"
  job:
    <<: *job
    use_left: false
    use_right: true
  outputs:
    same_arms_tool_shed_pick_value:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        s1:
          asserts:
            - that: has_text
              text: sample-one
            - that: has_text
              text: right-arm
        s2:
          asserts:
            - that: has_text
              text: sample-two
            - that: has_text
              text: right-arm
    same_arms_builtin_pick_value:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        s1:
          asserts:
            - that: has_text
              text: sample-one
            - that: has_text
              text: right-arm
        s2:
          asserts:
            - that: has_text
              text: sample-two
            - that: has_text
              text: right-arm
    different_arms_filter_then_merge:
      class: Collection
      collection_type: list
      element_count: 3
      element_tests:
        b1:
          asserts:
            has_text:
              text: right-one
        b2:
          asserts:
            has_text:
              text: right-two
        b3:
          asserts:
            has_text:
              text: right-three
    same_arms_direct_merge:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests: {}
    same_arms_direct_merge_live_plus_right_samples:
      class: Collection
      collection_type: list
      element_count: 3
      element_tests:
        b1:
          asserts:
            has_text:
              text: right-one
        b2:
          asserts:
            has_text:
              text: right-two
        b3:
          asserts:
            has_text:
              text: right-three
    different_arms_direct_merge:
      class: Collection
      collection_type: list
      element_count: 5
      element_tests:
        b1:
          asserts:
            has_text:
              text: right-one
        b2:
          asserts:
            has_text:
              text: right-two
        b3:
          asserts:
            has_text:
              text: right-three
    different_arms_direct_merge_live:
      class: Collection
      collection_type: list
      element_count: 3
      element_tests:
        b1:
          asserts:
            has_text:
              text: right-one
        b2:
          asserts:
            has_text:
              text: right-two
        b3:
          asserts:
            has_text:
              text: right-three
